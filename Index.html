<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Slime Hunter: Poket Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* INTERFAZ DE USUARIO (UI) */
        #ui { position: absolute; top: 25px; left: 25px; z-index: 10; pointer-events: none; }
        #health-border { width: 280px; height: 22px; border: 3px solid #0f3d0f; background: rgba(0,0,0,0.6); border-radius: 12px; overflow: hidden; box-shadow: 0 0 15px rgba(0,255,0,0.2); }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .stat-label { color: #fff; font-weight: bold; margin-top: 10px; font-size: 18px; text-shadow: 2px 2px 4px #000; letter-spacing: 1px; }

        /* EFECTOS DE PANTALLA */
        #damage-vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 40%, rgba(139,0,0,0.6) 100%); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
        #muzzle-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 4; }

        /* MIRA (CROSSHAIR) */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #32ff32; box-shadow: 0 0 8px rgba(0,0,0,0.8); }
        #crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; margin-top: -1px; }
        #crosshair::after { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }

        /* MENÚS */
        #menu-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 100; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
        .menu-card { background: rgba(255, 255, 255, 0.1); padding: 50px; border-radius: 30px; border: 2px solid #2ecc71; text-align: center; color: white; box-shadow: 0 0 50px rgba(46, 204, 113, 0.3); }
        h1 { margin: 0; font-size: 48px; color: #2ecc71; text-transform: uppercase; text-shadow: 0 0 20px rgba(46, 204, 113, 0.6); }
        .btn-play { padding: 18px 45px; font-size: 22px; cursor: pointer; background: #2ecc71; color: #000; border: none; border-radius: 12px; font-weight: bold; margin-top: 30px; transition: 0.3s; }
        .btn-play:hover { background: #27ae60; transform: scale(1.1); box-shadow: 0 0 20px #2ecc71; }

        #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
    </style>
</head>
<body>

    <div id="muzzle-flash"></div>
    <div id="damage-vignette"></div>
    
    <div id="ui">
        <div id="health-border"><div id="health-bar"></div></div>
        <div class="stat-label">SALUD: <span id="hp-val">100</span>%</div>
        <div class="stat-label">SLIMES DESTRUIDOS: <span id="score-val">0</span></div>
    </div>

    <div id="crosshair"></div>

    <div id="menu-wrapper">
        <div class="menu-card">
            <h1>Slime Hunter</h1>
            <p>Manten presionado el clic para <b>disparo automático</b></p>
            <button class="btn-play" id="start-btn">INICIAR MISIÓN</button>
        </div>
    </div>

    <div id="game-over">
        <h1 style="color: #e74c3c;">MISIÓN FALLADA</h1>
        <p id="final-stats" style="font-size: 20px;"></p>
        <button class="btn-play" onclick="location.reload()">REINTENTAR</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. CONFIGURACIÓN TÉCNICA ---
        let hp = 100, score = 0, isGameOver = false;
        const enemies = [], particles = [], tracers = [];
        const clock = new THREE.Clock();
        const textureLoader = new THREE.TextureLoader();

        // VARIABLES DE DISPARO AUTOMÁTICO
        let isShooting = false;
        let shootTimer = 0;
        const fireRate = 0.15; // Tiempo entre balas (0.15s = ametralladora)

        // --- 2. CARGA DE TEXTURAS REALES ---
        const grassMap = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        grassMap.wrapS = grassMap.wrapT = THREE.RepeatWrapping;
        grassMap.repeat.set(64, 64);
        
        const slimeNormalMap = textureLoader.load('https://threejs.org/examples/textures/water/Water_1_M_Normal.jpg');
        slimeNormalMap.wrapS = slimeNormalMap.wrapT = THREE.RepeatWrapping;

        // --- 3. ESCENA E ILUMINACIÓN ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(100, 200, 100);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 4. TERRENO DETALLADO ---
        const getH = (x, z) => Math.sin(x * 0.04) * Math.cos(z * 0.04) * 5 + Math.sin(x * 0.01) * 3;
        const terrainGeo = new THREE.PlaneGeometry(1000, 1000, 128, 128);
        terrainGeo.rotateX(-Math.PI / 2);
        const v = terrainGeo.attributes.position.array;
        for (let i = 0; i < v.length; i += 3) v[i+1] = getH(v[i], v[i+2]);
        terrainGeo.computeVertexNormals();
        const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ map: grassMap, roughness: 0.9 }));
        terrain.receiveShadow = true;
        scene.add(terrain);

        // --- 5. SISTEMA DE ARMA ---
        const gunGroup = new THREE.Group();
        const gunBody = new THREE.Mesh(
            new THREE.BoxGeometry(0.3, 0.4, 1.8),
            new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 })
        );
        gunGroup.add(gunBody);
        gunGroup.position.set(0.7, -0.6, -1.2);
        camera.add(gunGroup);
        scene.add(camera);

        // --- 6. SISTEMA DE PARTÍCULAS ---
        function spawnSlimeBurst(pos, color, amount = 15) {
            for (let i = 0; i < amount; i++) {
                const p = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 4, 4),
                    new THREE.MeshStandardMaterial({ color: color, transparent: true, opacity: 0.8 })
                );
                p.position.copy(pos);
                p.userData = {
                    velocity: new THREE.Vector3((Math.random()-0.5)*12, Math.random()*12, (Math.random()-0.5)*12),
                    life: 1.0
                };
                scene.add(p);
                particles.push(p);
            }
        }

        // --- 7. MECÁNICA DE DISPARO ---
        const raycaster = new THREE.Raycaster();
        function handleShoot() {
            if (!controls.isLocked || isGameOver) return;

            document.getElementById('muzzle-flash').style.opacity = "0.2";
            setTimeout(() => document.getElementById('muzzle-flash').style.opacity = "0", 40);
            gunGroup.position.z = -0.8;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(enemies);

            const tracerGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0.7, -0.5, -1).applyMatrix4(camera.matrixWorld),
                hits.length > 0 ? hits[0].point : raycaster.ray.at(200, new THREE.Vector3())
            ]);
            const tracer = new THREE.Line(tracerGeo, new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 }));
            scene.add(tracer);
            tracers.push({ mesh: tracer, life: 1.0 });

            if (hits.length > 0) {
                const target = hits[0].object;
                target.userData.hp -= 1;
                spawnSlimeBurst(hits[0].point, 0x32ff32, 5);
                target.material.emissive.setHex(0x55ff55);
                setTimeout(() => { if(target.parent) target.material.emissive.setHex(0x000000); }, 100);

                if (target.userData.hp <= 0) {
                    spawnSlimeBurst(target.position, 0x00ff00, 25);
                    scene.remove(target);
                    enemies.splice(enemies.indexOf(target), 1);
                    score++;
                    document.getElementById('score-val').innerText = score;
                    spawnSlime();
                }
            }
        }

        // --- 8. IA ENEMIGA ---
        const slimeGeo = new THREE.CapsuleGeometry(1.2, 1, 8, 16);
        function spawnSlime() {
            const mat = new THREE.MeshPhongMaterial({ 
                color: 0x00ff44, transparent: true, opacity: 0.75, 
                normalMap: slimeNormalMap, shininess: 120, specular: 0xffffff
            });
            const slime = new THREE.Mesh(slimeGeo, mat);
            slime.castShadow = true;
            slime.userData = { hp: 3, offset: Math.random() * Math.PI * 2, speed: 4 + Math.random() * 3 };

            const angle = Math.random() * Math.PI * 2;
            const dist = 120 + Math.random() * 60;
            slime.position.set(camera.position.x + Math.cos(angle) * dist, 0, camera.position.z + Math.sin(angle) * dist);
            scene.add(slime);
            enemies.push(slime);
        }
        for (let i = 0; i < 20; i++) spawnSlime();

        // --- 9. CONTROLES ---
        const controls = new PointerLockControls(camera, document.body);
        const startBtn = document.getElementById('start-btn');
        const menu = document.getElementById('menu-wrapper');

        startBtn.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => menu.style.display = 'none');
        controls.addEventListener('unlock', () => { if(!isGameOver) menu.style.display = 'flex'; });

        // EVENTOS PARA DISPARO AUTOMÁTICO
        window.addEventListener('mousedown', (e) => { if(e.button === 0) isShooting = true; });
        window.addEventListener('mouseup', (e) => { if(e.button === 0) isShooting = false; });

        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // --- 10. BUCLE DE JUEGO ---
        const vel = new THREE.Vector3(), dir = new THREE.Vector3();
        let lastDamageTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.elapsedTime;

            if (controls.isLocked && !isGameOver) {
                // LOGICA DE DISPARO CONTINUO
                if (isShooting && time - shootTimer > fireRate) {
                    handleShoot();
                    shootTimer = time;
                }

                // Movimiento
                vel.x -= vel.x * 10.0 * delta;
                vel.z -= vel.z * 10.0 * delta;
                dir.z = Number(keys['KeyW'] || 0) - Number(keys['KeyS'] || 0);
                dir.x = Number(keys['KeyD'] || 0) - Number(keys['KeyA'] || 0);
                dir.normalize();
                if (keys['KeyW'] || keys['KeyS']) vel.z -= dir.z * 500.0 * delta;
                if (keys['KeyA'] || keys['KeyD']) vel.x -= dir.x * 500.0 * delta;
                controls.moveRight(-vel.x * delta);
                controls.moveForward(-vel.z * delta);
                camera.position.y = getH(camera.position.x, camera.position.z) + 2.6;

                // Animación Arma
                gunGroup.position.z = THREE.MathUtils.lerp(gunGroup.position.z, -1.2, 0.1);
                gunGroup.position.y = -0.6 + Math.sin(time * 4) * 0.015;
                gunGroup.position.x = 0.7 + Math.cos(time * 2) * 0.01;

                // Update Partículas
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.position.addScaledVector(p.userData.velocity, delta);
                    p.userData.velocity.y -= 25 * delta;
                    p.userData.life -= delta * 1.5;
                    p.scale.setScalar(p.userData.life);
                    if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
                }

                // Actualizar Trazadores
                for (let i = tracers.length - 1; i >= 0; i--) {
                    tracers[i].life -= delta * 5;
                    tracers[i].mesh.material.opacity = tracers[i].life;
                    if (tracers[i].life <= 0) { scene.remove(tracers[i].mesh); tracers.splice(i, 1); }
                }

                // IA Slimes
                enemies.forEach(en => {
                    const toPlayer = new THREE.Vector3().subVectors(camera.position, en.position);
                    toPlayer.y = 0; toPlayer.normalize();
                    en.position.addScaledVector(toPlayer, en.userData.speed * delta);
                    en.position.y = getH(en.position.x, en.position.z) + 1.2;
                    const wobble = Math.sin(time * 6 + en.userData.offset);
                    en.scale.set(1 - wobble * 0.1, 1 + wobble * 0.2, 1 - wobble * 0.1);
                    en.material.normalMap.offset.x += 0.1 * delta;

                    if (en.position.distanceTo(camera.position) < 4 && time - lastDamageTime > 1.2) {
                        hp -= 20;
                        lastDamageTime = time;
                        document.getElementById('health-bar').style.width = hp + "%";
                        document.getElementById('hp-val').innerText = hp;
                        document.getElementById('damage-vignette').style.opacity = "1";
                        setTimeout(() => document.getElementById('damage-vignette').style.opacity = "0", 300);
                        if (hp <= 0) {
                            isGameOver = true;
                            controls.unlock();
                            document.getElementById('game-over').style.display = 'flex';
                            document.getElementById('final-stats').innerText = `Slimes Purgados: ${score}`;
                        }
                    }
                });
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
